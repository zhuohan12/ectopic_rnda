name: ribosert
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.10

  # Workflow
  - snakemake=7.32.4

  # Alignment & BAM processing
  - bwa-mem2=2.3
  - samtools=1.22.1
  - htslib=1.22.1
  - pysam=0.23.3
  - minimap2=2.30

  # Read utilities
  - seqtk=1.5
  - seqkit=2.10.1
  - bbmap=39.37
  - fastqc=0.12.1

  # Genome interval tools
  - bedtools=2.31.1
  - mosdepth=0.3.10

  # Long-read SV calling (validation)
  - sniffles=2.7.1

  # Sequence search
  - blast=2.16.0
  - jellyfish=1.1.3

  # NCBI data access
  - entrez-direct=22.4
  - sra-tools=3.1.1

  # Python data analysis
  - numpy=2.2.6
  - pandas=2.3.1
  - scipy=1.15.2
  - statsmodels=0.14.5
  - biopython=1.85
  - python-edlib=1.3.9.post1

  # Plotting
  - matplotlib=3.10.3
  - matplotlib-venn=1.1.2
  - seaborn=0.13.2

  # Utilities
  - pyyaml=6.0.2
  - openpyxl=3.1.5
  - tabulate=0.9.0
  - rich=14.1.0
  - wget=1.21.4

  # Interactive / notebooks
  - ipython=8.37.0
  - ipykernel=6.29.5

  # Testing
  - pytest=8.4.1
